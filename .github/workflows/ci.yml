name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling (no runtime deps by design)
        run: python -m pip install --upgrade pytest
      - name: Run tests
        run: python -m pytest -q tests

  swift:
    name: Swift build + protocol self-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        working-directory: macapp
        run: swift build
      - name: Build SelfTest
        working-directory: macapp
        run: swift build --product SelfTest
      - name: RAPI protocol self-test (Swift client vs Python fake device)
        run: |
          python3 tests/serve_fake.py 60 > /tmp/port &
          sleep 3
          macapp/.build/debug/SelfTest rapi "$(cat /tmp/port)"
      - name: CEDB record codec self-test (Swift pack/unpack vs librapi2 layout)
        run: macapp/.build/debug/SelfTest cedb x
      - name: Send-mirror format parity (Swift writer vs Python validator)
        run: |
          PAR=$(mktemp -d)
          macapp/.build/debug/SelfTest mirror "$PAR"
          python3 tests/check_mirror_parity.py "$PAR"
      - name: USB link table parity (Swift dump vs Python reference)
        run: |
          macapp/.build/debug/SelfTest usb-profiles /tmp/usb-table.json
          python3 tests/check_usb_parity.py /tmp/usb-table.json
